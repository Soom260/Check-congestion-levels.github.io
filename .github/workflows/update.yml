name: 혼잡도 데이터 갱신

on:
  schedule:
    # 30분마다 자동 실행 (UTC 기준, KST는 +9시간).
    # GitHub Actions의 cron은 부하에 따라 실제 실행이 지연될 수 있다.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # Actions 탭에서 수동 실행 가능

permissions:
  contents: write # data/congestion.json 커밋·푸시를 위해 필요

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 서울시 API 수집
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python scripts/fetch_data.py

      - name: 변경 사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/congestion.json
          git diff --cached --quiet && echo "변경 없음, 커밋 생략" && exit 0
          git commit -m "chore: 혼잡도 데이터 갱신"
          git push
